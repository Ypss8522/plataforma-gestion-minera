services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: minera_user
      POSTGRES_PASSWORD: minera_pass_dev
      POSTGRES_DB: minera_acreditacion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
